# ScrubEX — Redis configuration
#
# These are ARCHITECTURAL SETTINGS, NOT PERFORMANCE TUNING.
#
# Redis is the only datastore in the system, and its per-key TTL is the deletion
# mechanism for every job. No application code deletes a job record (invariant
# 1) -- if every worker crashed and the API went down, records would still
# expire on schedule. That is what makes non-retention a guarantee rather than a
# promise, and it is the product's central claim.
#
# If you are here at 2am troubleshooting, read the comment above each setting
# before changing it. Two of the three changes an operator would reach for first
# will silently falsify a published privacy claim or destroy live user work.

# --- Persistence: disabled, and this is a privacy control -------------------

# SECURITY CONTROL. Do not enable RDB snapshots.
# A snapshot writes job records to disk, where they survive their TTL. Expired
# files and metadata reports would then exist in a .rdb file after the product
# has told the user they are gone -- making the core privacy claim technically
# false. Total loss of in-flight jobs on restart is the accepted trade
# (security.md residual risk: "a Redis restart destroys in-flight jobs").
save ""

# SECURITY CONTROL. Do not enable the append-only file.
# Same failure as above by a different route: an AOF log retains the write
# history of every expired job. Backups are scoped to configuration only and
# must never include job data (invariant 14).
appendonly no

# --- Eviction: must stay noeviction -----------------------------------------

# SECURITY CONTROL. Do not change to any allkeys-* policy.
# An allkeys-lru or allkeys-random policy lets Redis evict live job records early
# under memory pressure, silently destroying in-flight work with no error to the
# user or the operator. Failing loudly at admission is correct; losing a job
# quietly is not. The admission funnel is what handles capacity, not eviction.
maxmemory-policy noeviction

# --- Command surface --------------------------------------------------------

# Removed from the command surface. CONFIG would let a compromised client
# re-enable persistence at runtime, bypassing every comment above. The others
# are blast-radius reduction: FLUSHALL/FLUSHDB destroy every live job, and KEYS
# enumerates them.
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command DEBUG ""

# --- Network posture --------------------------------------------------------

# Reachable only from the `core` compose network, which is declared
# internal: true and therefore has no route to the internet (invariant 3).
# Egress denial here is topological rather than firewall-based: there is no rule
# to drift out of sync with intent.
protected-mode yes
bind 0.0.0.0
port 6379

# The password is supplied at runtime from the REDIS_PASSWORD environment
# variable via the compose command, never baked into this file or an image layer
# (T15). Redis ACL users separating the api, worker and ops roles arrive in P1,
# alongside the job store that uses them.

# --- Durability of the ephemeral guarantee ----------------------------------

# /data is mounted as tmpfs in compose. There is deliberately nowhere for Redis
# to persist even if a future edit re-enabled snapshotting.
dir /data
